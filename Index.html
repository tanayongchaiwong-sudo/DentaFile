<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentaFile Cloud | อัปโหลดไฟล์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">
    <nav class="bg-blue-600 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-600 p-2 rounded-lg"><i class="fa-solid fa-tooth text-xl"></i></div>
                <span class="font-bold text-xl text-white">DentaFile Cloud</span>
            </div>
        </div>
    </nav>

    <!-- กล่องคำแนะนำผู้ใช้งาน -->
    <div class="max-w-3xl mx-auto w-full px-4 pt-6">
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded text-sm text-blue-800">
            <p class="font-bold"><i class="fa-solid fa-circle-info mr-1"></i> เคล็ดลับการกรอกข้อมูล:</p>
            <p>หากเป็นการส่งข้อมูลครั้งแรก กรุณาระบุชื่อคลินิกและอีเมลในรูปแบบ <b>ชื่อคลินิก (อีเมล)</b> ลงในช่อง <b>"อื่นๆ"</b> เพื่อให้ระบบดึงข้อมูลมาแสดงให้คลิกเลือกอัตโนมัติในครั้งถัดไป</p>
        </div>
    </div>

    <main class="flex-grow max-w-3xl mx-auto w-full p-4">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <!-- *** ใส่ลิงก์ Google Form *** -->
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfFTEbjSeBRAYey-YNrSSoOYtWAcMHBDLWks93DkYMDvLZuiw/viewform?usp=dialog" width="100%" height="900" frameborder="0" class="w-full">กำลังโหลด...</iframe>
        </div>
    </main>
</body>
</html>
